name: MidnightGate CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test Contract Circuits & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            test/package-lock.json
            frontend/package-lock.json

      - name: Install Test Dependencies & Run Test Suite
        working-directory: test
        run: |
          npm ci || npm install
          npm test

      - name: Install Frontend Dependencies & Run Build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
